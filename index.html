<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy-Paste Helper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=JetBrains+Mono:wght@400&family=Orbitron:wght@400;700;900&family=Permanent+Marker&family=Bangers&family=Outfit:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="fixed-background"></div>
    <div class="main-container">
        <h1>
            <span class="brand">
                <span class="letter letter-c">C</span>
                <span class="letter letter-p">P</span>
                <span class="letter letter-h">H</span>
            </span>
            <span class="tagline">the future, the past and the present</span>
        </h1>
        <div class="content-wrapper">
            <div class="pointer pointer-left">
                <span class="text">WRITE HERE</span>
                <span class="arrow">➔</span>
            </div>
            <div class="glass-card">
                <textarea id="textInput" placeholder="Paste your text here... or type something..."></textarea>
            </div>
            <div class="pointer pointer-right">
                <span class="arrow">➔</span>
                <span class="text">WRITE HERE</span>
            </div>
        </div>
        <div class="btn-group">
            <div class="btn-wrapper">
                <button id="copyBtn" class="btn btn-primary">
                    <span class="icon" style="font-size: 1.5rem;">📋</span>
                </button>
                <span class="btn-label">copy</span>
            </div>
            <div class="btn-wrapper">
                <button id="pasteBtn" class="btn btn-secondary">
                    <span class="icon" style="font-size: 1.5rem;">📥</span>
                </button>
                <span class="btn-label">paste</span>
            </div>
            <div class="btn-wrapper">
                <button id="clearBtn" class="btn btn-clear">
                    <span class="icon" style="font-size: 1.5rem;">🗑️</span>
                </button>
                <span class="btn-label">clear</span>
            </div>
        </div>
        <div id="statusMessage" class="status-message hidden">Copied!</div>

        <div class="history-container">
            <h2>Clipboard History</h2>
            <ul id="historyList" class="history-list">
            </ul>
        </div>
        <footer class="copyright-footer">
            <p>&copy; Copyright by Harsh Mishra, @ Copy Paste Helper</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
